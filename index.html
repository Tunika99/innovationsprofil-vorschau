      ms.forEach(function (x) { counts[x.d.answers[i] - 1]++; });
      return { i: i, q: q, sd: Math.sqrt(avg(v.map(function (x) { return (x - m) * (x - m); }))), range: Math.max.apply(null, v) - Math.min.apply(null, v), counts: counts };
    }).filter(function (x) { return x.range >= 50; }).sort(function (a, b) { return b.sd - a.sd; }).slice(0, 3);
    var lead = ms.filter(function (x) { return x.d.role === 1 || x.d.role === 2; }), staff = ms.filter(function (x) { return x.d.role === 3; });
    if (lead.length && staff.length) {
      out.gap = C.elements.map(function (e) {
        return { e: e, diff: Math.round(avg(lead.map(function (x) { return x.res.per[e.id]; })) - avg(staff.map(function (x) { return x.res.per[e.id]; }))) };
      }).sort(function (a, b) { return Math.abs(b.diff) - Math.abs(a.diff); })[0];
    }

  }

  function pageInfo() {
    var pg = PAGES[state.page], open = -1, missing = 0;
    pg.idx.forEach(function (qi, k) { if (state.answers[qi] == null) { missing++; if (open < 0) open = k; } });
    return { pg: pg, open: open, missing: missing };
  }
  function updateQuestion(warn) {
    var info = pageInfo(), sts = root.querySelectorAll('.itz-st');
    sts.forEach(function (el, k) {
      var qi = info.pg.idx[k];
      el.classList.toggle('is-done', state.answers[qi] != null);
      el.classList.toggle('is-active', k === info.open);
    });
    var done = state.answers.filter(function (a) { return a != null; }).length, total = state.answers.length;
    var bar = root.querySelector('.itz-prog');
    if (bar) {
      bar.setAttribute('aria-valuenow', done);
      bar.setAttribute('aria-label', fill(T.ui.progress, { done: done, total: total }));
      bar.firstChild.style.width = Math.round(done / total * 100) + '%';
    }
    var st = root.querySelector('.itz-qstatus'), btn = root.querySelector('[data-action="next"]');
    if (btn) btn.setAttribute('aria-disabled', String(info.missing > 0));
    if (st) {
      if (warn && info.missing) { st.textContent = info.missing === 1 ? T.ui.missingOne : fill(T.ui.missing, { n: info.missing }); st.classList.add('is-warn'); }
      else if (!info.missing || !st.classList.contains('is-warn')) { st.textContent = fill(T.ui.progress, { done: done, total: total }); st.classList.remove('is-warn'); }
    }

    }
    else if (a === 'copy-link') { copyPlain(el.getAttribute('data-link'), el, T.team.copied); }
    else if (a === 'native-link') { navigator.share({ title: el.getAttribute('data-title'), url: el.getAttribute('data-link') }).catch(function () {}); }
    else if (a === 'copy-post') copyText(postValue(), el, T.share.copied);
    else if (a === 'li-quick') {
      if (!shareBlob) return;
      var note = root.querySelector('#itz-quick-note');
      /* Am Handy über das Teilen-Menü direkt in die LinkedIn-App, am Rechner über LinkedIn im Browser */
      if (canShareFile() && window.matchMedia && matchMedia('(pointer: coarse)').matches) {
        navigator.share({ files: [shareFile()], text: postValue() }).catch(function () {});
        return;
      }
      var dl = document.createElement('a');
      dl.href = shareUrl; dl.download = T.share.fileName;
      document.body.appendChild(dl); dl.click(); dl.remove();
      copyText(postValue());
      window.open(linkedinHref(postValue()), '_blank', 'noopener');
      if (note) { note.hidden = false; note.textContent = T.share.quickDone; }
    }
    else if (a === 'open-linkedin') { el.href = linkedinHref(postValue()); copyText(postValue()); }
  });

  document.addEventListener('keydown', function (ev) {
    if (state.screen !== 'question' || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var t = ev.target;
    if (t && ((t.tagName === 'INPUT' && t.type !== 'radio') || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var n = Number(ev.key);
    if (!(n >= 1 && n <= 5)) return;
    var info = pageInfo();
    if (info.open < 0) return;
    ev.preventDefault();
    setAnswer(info.pg.idx[info.open], n, true);
  });

  root.addEventListener('submit', function (ev) {
    var form = ev.target, kind = form.getAttribute('data-form');
    if (kind === 'team-join') {
      ev.preventDefault();
      var jin = form.querySelector('#itz-join'), jid = parseTeamCode(jin.value), jerr = form.querySelector('#itz-join-err');
      if (!jid) { jerr.hidden = false; jerr.textContent = T.team.joinError; jin.setAttribute('aria-invalid', 'true'); jin.focus(); return; }
      var jt = loadTeams(); if (!jt[jid]) { jt[jid] = { name: '', created: Date.now(), members: [] }; saveTeams(jt); }
      state.leadTeam = jid; state.invite = { id: jid, name: jt[jid].name || '' };
      closeDialog(); state.screen = 'question'; state.page = 0; render();
      return;
    }
    if (form.getAttribute('data-form') !== 'newsletter') return;
    ev.preventDefault();
    var N = T.newsletter, email = form.querySelector('#itz-email'), consent = form.querySelector('#itz-consent');
    var eErr = form.querySelector('#itz-email-err'), cErr = form.querySelector('#itz-consent-err'), status = form.querySelector('#itz-news-status');
    var okMail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim());
    eErr.hidden = okMail; eErr.textContent = okMail ? '' : N.errorEmail; email.setAttribute('aria-invalid', String(!okMail));
    cErr.hidden = consent.checked; cErr.textContent = consent.checked ? '' : N.errorConsent; consent.setAttribute('aria-invalid', String(!consent.checked));
    if (!okMail) { email.focus(); return; }
    if (!consent.checked) { consent.focus(); return; }
    sendToNewsletter(email.value.trim()).then(function (r) {
      status.hidden = false;
      status.textContent = r === 'not-connected' ? N.notConnected : N.success;
      if (r !== 'not-connected') form.reset();
    }, function () { status.hidden = false; status.textContent = N.failed; });
  });

  /* ---------- Einbettung per iframe: Höhe an die Shop-Seite melden ---------- */
  function notifyHeight() {
    if (!inFrame) return;
    try { window.parent.postMessage({ type: 'itz-hoehe', height: Math.ceil(root.getBoundingClientRect().height) }, '*'); } catch (e) {}
  }
  if (inFrame && 'ResizeObserver' in window) new ResizeObserver(notifyHeight).observe(root);

  if (C.team.enabled) {
    readHash();
    window.addEventListener('hashchange', function () { var was = state.screen; readHash(); if (state.screen !== was || state.screen === 'team') render(); });
  }
  render(false);
})();
</script>
